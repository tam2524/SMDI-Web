<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SMDI Web Systems</title>
    <!-- Favicon -->
    <link rel="icon" href="assets/img/smdi_logosmall.png" type="image/png">

    <!-- Premium Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Styled CSS -->
    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-blue-hover: rgba(37, 99, 235, 0.7);
            --dark-blue: #1d4ed8;
            --deep-blue: #0a0f24;
            --soft-blue: #dbeafe;
            --white: #ffffff;
            --gray-100: #f1f5f4;
            --gray-200: #e2e8e6;
            --gray-300: #cbd5e1;
            --gray-700: #334155;
            --gray-900: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.55);
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.4);
            --input-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 50%, var(--deep-blue) 0%, #050814 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: var(--white);
        }

        /* Ambient Animated Background Orbs */
        .bg-orbs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: floatOrb 25s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--dark-blue) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            animation-duration: 20s;
        }

        .orb-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-blue) 0%, transparent 70%);
            bottom: -200px;
            right: -100px;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #1e40af 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 25s;
            animation-delay: -10s;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(50px, -30px) scale(1.1);
            }

            100% {
                transform: translate(-30px, 50px) scale(0.95);
            }
        }

        /* Main Wrapper */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            animation: fadeInCard 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInCard {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glassmorphic Card */
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.03) 50%,
                    rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            transition: 0.75s;
        }

        .login-card:hover::before {
            left: 150%;
            transition: 0.75s;
        }

        /* Brand / Header Section */
        .brand-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 16px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .logo-container:hover {
            transform: scale(1.05) rotate(2deg);
            border-color: var(--primary-blue);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
        }

        .brand-logo {
            width: 52px;
            height: auto;
            border-radius: 8px;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--white);
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--gray-300);
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* Input Controls */
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-300);
            font-size: 1.1rem;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 14px;
            padding: 15px 16px 15px 46px;
            color: var(--white);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form-control:focus {
            border-color: var(--primary-blue);
            background: rgba(15, 23, 42, 0.6);
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.25);
        }

        .form-control:focus+.input-icon {
            color: var(--primary-blue);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s ease;
            user-select: none;
        }

        .password-toggle:hover {
            color: var(--primary-blue);
        }

        /* Option row */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--gray-300);
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            background: var(--input-bg);
            cursor: pointer;
            position: relative;
            outline: none;
            transition: all 0.2s ease;
        }

        .remember-me input[type="checkbox"]:checked {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
        }

        .remember-me input[type="checkbox"]:checked::after {
            content: "\F26E";
            font-family: "bootstrap-icons";
            position: absolute;
            font-size: 10px;
            color: white;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
            border: none;
            border-radius: 14px;
            padding: 15px;
            color: var(--white);
            font-weight: 600;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
            opacity: 0.95;
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loader Icon Animation */
        .spin {
            animation: spinAnimation 1s linear infinite;
            display: inline-block;
        }

        @keyframes spinAnimation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Alerts */
        .alert-container {
            margin-top: 20px;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Registration overlay & modal styling */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 8, 20, 0.7);
            backdrop-filter: blur(12px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .popup-form {
            background: var(--card-bg);
            backdrop-filter: blur(32px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: var(--white);
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalPop {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .popup-form h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .popup-form label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--gray-300);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .popup-form input,
        .popup-form select {
            width: 100%;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--white);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 18px;
            font-family: inherit;
        }

        .popup-form select option {
            background: var(--gray-900);
            color: var(--white);
        }

        .popup-form input:focus,
        .popup-form select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.25);
        }

        .popup-form .btn-submit-reg {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: var(--white);
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .popup-form .btn-close-reg {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            color: var(--white);
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        .popup-form .btn-close-reg:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fca5a5;
        }

        .popup-form .btn-submit-reg:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* Register Link styling */
        .register-prompt {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--gray-300);
        }

        .register-prompt a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .register-prompt a:hover {
            color: var(--soft-blue);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 24px;
                border-radius: 20px;
            }

            .brand-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <!-- Fluid ambient background -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Main login card wrapper -->
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Brand section -->
            <div class="brand-section">
                <div class="logo-container">
                    <img src="assets/img/smdi_logosmall.png" alt="SMDI Logo" class="brand-logo">
                </div>
                <h1 class="brand-title">SMDI</h1>
                <p class="brand-subtitle">Web Systems</p>
            </div>

            <!-- Login form -->
            <form id="loginForm">
                <!-- Username -->
                <div class="input-group-custom">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Username"
                        required autocomplete="username">
                    <span class="input-icon"><i class="bi bi-person"></i></span>
                </div>

                <!-- Password -->
                <div class="input-group-custom">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Password"
                        required autocomplete="current-password">
                    <span class="input-icon"><i class="bi bi-lock"></i></span>
                    <span class="password-toggle" id="togglePasswordBtn"><i class="bi bi-eye"></i></span>
                </div>

                <!-- Options -->
                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                </div>

                <!-- Action button -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span id="btnText">Sign In</span>
                </button>
            </form>

            <!-- Alert container inside card -->
            <div id="alertBox" class="alert-container alert-error" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span id="alertMessage">Invalid credentials.</span>
            </div>

            <!-- Optional Register Button (styled beautifully, commented out but matches the previous template structure) -->
            <!-- <div class="register-prompt">
                No account? <a href="#" onclick="showPopupForm()">Register now</a>
            </div> -->
        </div>
    </div>

    <!-- Registration Modal -->
    <div class="overlay" id="overlay">
        <div class="popup-form">
            <h2>Register Now</h2>
            <form action="api/registerUser.php" method="post" id="registerForm">
                <label for="registerUsername">Username</label>
                <input type="text" id="registerUsername" name="registerUsername" required placeholder="Enter username">

                <label for="registerFullName">Full Name</label>
                <input type="text" id="registerFullName" name="registerFullName" required placeholder="Enter full name">

                <label for="registerPosition">Position</label>
                <select id="registerPosition" name="registerPosition" required>
                    <option value="Receptionist">Receptionist</option>
                    <option value="Branch Manager">Branch Manager</option>
                    <option value="IT Staff">IT</option>
                    <option value="Head">Head</option>
                    <option value="Liaison">Liaison</option>
                </select>

                <label for="registerBranch">Branch</label>
                <select id="registerBranch" name="registerBranch" required>
                    <option value="HeadOffice">Head Office</option>
                    <option value="RoxasSuzuki">Roxas 3s Suzuki</option>
                    <option value="RoxasHonda">Roxas Honda</option>
                    <option value="KridersRoxas">Kriders Roxas</option>
                    <option value="Passi">Passi</option>
                    <option value="Passi2">Passi 2</option>
                    <option value="KaliboHonda">Kalibo Honda</option>
                    <option value="KaliboSuzuki">Kalibo Suzuki</option>
                    <option value="Jaro1">Jaro 1</option>
                    <option value="Jaro2">Jaro 2</option>
                    <option value="Guimaras">Guimaras</option>
                    <option value="DelgadoHonda">Delgado Honda</option>
                    <option value="DelgadoSuzuki">Delgado Suzuki</option>
                    <option value="Balasan">Balasan</option>
                    <option value="Antique1">Antique 1</option>
                    <option value="AntiqueHonda">Antique Honda</option>
                    <option value="Culasi">Culasi</option>
                    <option value="Bacolod">Bacolod</option>
                    <option value="Ajuy">Ajuy</option>
                    <option value="EEMSIGuimaras">EEMSI Guimaras</option>
                    <option value="PEMDIBacolod">PEMDI Bacolod</option>
                </select>

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" name="registerPassword" required
                    placeholder="Create password">

                <button type="submit" class="btn-submit-reg">Create Account</button>
            </form>
            <button onclick="hidePopupForm()" class="btn-close-reg">Cancel</button>
        </div>
    </div>

    <!-- Core Logic & AJAX Handler -->
    <script>
        // Toggle password visibility
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');

        togglePasswordBtn.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Toggle icon
            const icon = this.querySelector('i');
            if (type === 'text') {
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });

        // Form Submission via AJAX
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const alertBox = document.getElementById('alertBox');
        const alertMessage = document.getElementById('alertMessage');

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();

            // Clear alerts & set loading state
            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="bi bi-arrow-repeat spin me-2"></i> Authenticating...';

            const formData = new FormData(loginForm);
            formData.append('ajax', '1'); // Force AJAX mode

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'api/login.php', true);
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');

            xhr.onload = function () {
                submitBtn.disabled = false;
                btnText.innerHTML = 'Sign In';

                if (xhr.status === 200) {
                    try {
                        const response = JSON.parse(xhr.responseText);
                        if (response.success) {
                            alertBox.classList.remove('alert-error');
                            alertBox.classList.add('alert-success');
                            alertBox.querySelector('i').className = 'bi bi-check-circle-fill';
                            alertMessage.innerText = 'Login successful! Redirecting...';
                            alertBox.style.display = 'flex';

                            // Redirect after brief delay for visual feedback
                            setTimeout(() => {
                                window.location.href = response.redirect;
                            }, 800);
                        } else {
                            // Show error alert
                            alertBox.classList.remove('alert-success');
                            alertBox.classList.add('alert-error');
                            alertBox.querySelector('i').className = 'bi bi-exclamation-triangle-fill';
                            alertMessage.innerText = response.message || 'Login failed. Please try again.';
                            alertBox.style.display = 'flex';
                        }
                    } catch (e) {
                        console.error('Failed to parse response:', xhr.responseText);
                        alertBox.classList.remove('alert-success');
                        alertBox.classList.add('alert-error');
                        alertBox.querySelector('i').className = 'bi bi-exclamation-triangle-fill';
                        alertMessage.innerText = 'System error occurred. Please contact IT support.';
                        alertBox.style.display = 'flex';
                    }
                } else {
                    alertBox.style.display = 'flex';
                    alertMessage.innerText = 'Connection error. Status: ' + xhr.status;
                }
            };

            xhr.onerror = function () {
                submitBtn.disabled = false;
                btnText.innerHTML = 'Sign In';
                alertBox.style.display = 'flex';
                alertMessage.innerText = 'Network connection failed.';
            };

            xhr.send(formData);
        });

        // Modal triggers
        function showPopupForm() {
            document.getElementById("overlay").style.display = "flex";
        }

        function hidePopupForm() {
            document.getElementById("overlay").style.display = "none";
        }
    </script>

</body>

</html>
