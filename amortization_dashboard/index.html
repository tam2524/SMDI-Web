<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMDI Amortization Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Header with Logo and Upload Button -->
        <header class="dashboard-header">
            <div class="smdi-logo">
                <img src="../assets/img/smdi_logo.jpg" alt="SMDI Logo" class="logo-image">
               
            </div>
            <div class="upload-button-container">
                <button id="addPricingBtn">+ Add Pricing</button>
            </div>
        </header>

        <!-- Main Calculator Card -->
        <div class="card" id="calculator-card">
            <h2>Motorcycle Amortization Calculator</h2>
            <fieldset id="calculator-fieldset" disabled>
                <div class="form-group">
                    <label for="modelSearch">Search Motorcycle Model</label>
                    <div class="search-container">
                        <input type="text" id="modelSearch" placeholder="Type model name (e.g., Access 125, Click 125i)...">
                        <div id="searchResults" class="search-results"></div>
                    </div>
                </div>
                
                <div class="selected-model-info" id="selectedModelInfo" style="display: none;">
                    <div class="model-details">
                        <h4 id="selectedModelName"></h4>
                        <p><strong>Brand:</strong> <span id="selectedBrand"></span></p>
                        <!-- <p><strong>List Cash Price:</strong> ₱<span id="selectedLCP"></span></p> -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="downpayment">Your Down Payment (DP)</label>
                    <input type="number" id="downpayment" placeholder="Enter down payment amount">
                    <div class="dp-warning" id="dpWarning" style="display: none;">
                        Minimum down payment: ₱<span id="minDP">0</span>
                    </div>
                </div>
                <button id="calculateBtn">Calculate Amortization</button>
            </fieldset>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-header">
                <img src="../assets/img/smdi_logo.jpg" alt="SMDI Logo" class="modal-logo">
                <h2>Pricing Data Management</h2>
            </div>
            <p>The calculator is based on the currently loaded pricing file. Use the button below to update it.</p>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" id="pricingFile" name="pricingFile" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" required>
                <button type="submit">Upload & Process Pricing File</button>
            </form>
            <div id="uploadStatus"></div>
        </div>
    </div>

    <!-- Results Modal -->
    <div id="resultsModal" class="modal">
        <div class="modal-content results-modal">
            <span class="close-btn results-close">&times;</span>
            <div class="modal-header">
                <h2>Amortization Results</h2>
            </div>
            <div id="results-content" class="results-content"></div>
            <div class="modal-actions">
                <button id="closeResults" class="btn-primary">✓ Close</button>
            </div>
        </div>
    </div>

    <!-- Password Modal -->
<div id="passwordModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closePasswordModal()">&times;</span>
        <div class="modal-header">
            <img src="../assets/img/smdi_logo.jpg" alt="SMDI Logo" class="modal-logo">
            <h2>Admin Access Required!</h2>
        </div>
        <form id="passwordForm">
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="Enter admin password" required>
            </div>
            <button type="submit">Continue</button>
        </form>
        <div id="passwordStatus"></div>
    </div>
</div>

    <script src="app.js"></script>

</body>
</html>
